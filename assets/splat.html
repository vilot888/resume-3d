<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>高斯喷溅视图</title>
<style>
  :root{ --mint:#9ff0c8; --blue:#6ea8ff; --dim:#5f6d7c; }
  *{box-sizing:border-box}
  html,body{
    margin:0;height:100%;overflow:hidden;background:#04060a;
    font-family:ui-monospace,"JetBrains Mono","Cascadia Code",Consolas,monospace;
    -webkit-tap-highlight-color:transparent;
  }
  #canvas{
    display:block;position:absolute;inset:0;width:100%;height:100%;
    touch-action:none;cursor:grab;
  }
  #canvas:active{cursor:grabbing}

  #progress{
    position:absolute;top:0;left:0;height:3px;width:0;
    background:linear-gradient(90deg,var(--mint),var(--blue));
    box-shadow:0 0 12px rgba(159,240,200,.45);
    transition:width .15s linear;z-index:30;
  }

  #spinner{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    z-index:20;pointer-events:none;
  }
  #spinner::after{
    content:"";width:34px;height:34px;border-radius:50%;
    border:2px solid rgba(159,240,200,.18);
    border-top-color:var(--mint);
    animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  #message{
    position:absolute;left:0;right:0;bottom:34px;text-align:center;
    color:#ff8a82;font-size:12px;padding:0 16px;z-index:25;pointer-events:none;
  }

  #hud{
    position:absolute;left:10px;bottom:8px;z-index:25;
    font-size:11px;color:var(--dim);letter-spacing:.04em;pointer-events:none;
    display:flex;gap:12px;
  }
  #hud .ok{color:var(--mint)}
  @media (max-width:520px){ #hud{font-size:10px} }
</style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="progress"></div>
  <div id="spinner"></div>
  <div id="message"></div>
  <div id="hud"><span id="fps"></span><span id="camid"></span></div>

<script>
/* ------------------------------------------------------------------
   高斯喷溅（网格转喷溅）宿主页
   - 由父页面 index.html 以同源 iframe 嵌入，避免渲染器的全局变量污染简历页；
   - 通过 ?q=high|low 切换点位数量，低配模式用 HTTP Range 只取前 N 个点；
   - 用 postMessage 把加载进度 / 就绪 / 失败回传给父页面。
------------------------------------------------------------------- */
(function () {
  var params = new URLSearchParams(location.search);
  var lowSpec = params.get('q') === 'low';

  function post(msg) {
    try { parent.postMessage(Object.assign({ source: 'splat' }, msg), '*'); } catch (e) {}
  }

  window.__SPLAT_ACTIVE = true;
  window.SPLAT_OPTS = {
    url: 'scene.splat',
    maxPoints: lowSpec ? 140000 : 0,
    focalRatio: 0.86
  };
  window.SPLAT_ON_PROGRESS = function (pct, fps) { post({ type: 'progress', value: pct, fps: fps }); };
  window.SPLAT_ON_READY = function () { post({ type: 'ready' }); };
  window.SPLAT_ON_ERROR = function (err) {
    post({ type: 'error', message: String((err && err.message) || err) });
  };

  // 低配模式先降一档渲染分辨率，老核显也能跑起来
  if (lowSpec) {
    try {
      Object.defineProperty(window, 'devicePixelRatio', { get: function () { return 1; } });
    } catch (e) {}
  }

  var canvas = document.getElementById('canvas');
  var gl = null;
  try { gl = canvas.getContext('webgl2', { antialias: false }); } catch (e) {}
  if (!gl) {
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('message').textContent = '当前浏览器/设备不支持 WebGL2';
    post({ type: 'error', message: 'WebGL2 unavailable' });
    return;
  }

  var s = document.createElement('script');
  s.src = 'gsplat.min.js';
  s.onerror = function () {
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('message').textContent = '渲染器脚本加载失败';
    post({ type: 'error', message: 'gsplat.min.js load failed' });
  };
  document.body.appendChild(s);

  window.addEventListener('resize', function () {
    post({ type: 'resize' });
  });
})();
</script>
</body>
</html>
