<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>郭伟涛 · 3D 作品展示</title>
<style>
  :root{
    --ink:#e8edf2;
    --ink-2:#9aa7b4;
    --ink-3:#6b7887;
    --line:#242c36;
    --bg:#11151a;
    --accent:#3fbf9c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei","Source Han Sans SC",system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;
    padding:28px;
    -webkit-font-smoothing:antialiased;
  }
  .card{
    max-width:560px;width:100%;
    border:1px solid var(--line);border-radius:16px;
    padding:38px 34px 32px;
    background:#151a21;
  }
  .tag{
    display:inline-flex;align-items:center;gap:7px;
    font-size:12px;color:var(--accent);
    border:1px solid #1f4c42;background:#12211d;
    border-radius:20px;padding:4px 11px;margin-bottom:20px;
  }
  .dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
  h1{margin:0 0 10px;font-size:26px;font-weight:600;letter-spacing:1px;line-height:1.3}
  p{margin:0 0 8px;font-size:14px;line-height:1.75;color:var(--ink-2)}
  .meta{margin-top:24px;padding-top:20px;border-top:1px solid var(--line);
        font-size:13px;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:8px 20px}
  .meta b{color:var(--ink-2);font-weight:500}
  a{color:var(--accent);text-decoration:none;border-bottom:1px solid #1f4c42}
  a:hover{border-color:var(--accent)}
  ul{margin:14px 0 0;padding-left:18px;font-size:13.5px;color:var(--ink-2);line-height:1.9}
  ul li::marker{color:var(--ink-3)}
</style>
</head>
<body>
  <main class="card">
    <span class="tag"><span class="dot"></span>建设中</span>
    <h1>郭伟涛 · 3D 作品展示</h1>
    <p>这个页面将承载可交互 3D 模型与高斯喷溅（Gaussian Splatting）渲染，题材取自古建筑方向。</p>
    <ul>
      <li>可拖拽旋转的 <code>.glb</code> 模型（WebGL）</li>
      <li>高斯喷溅点云渲染，支持低配模式</li>
      <li>全资源本地化，断网也能演示</li>
    </ul>
    <div class="meta">
      <span>简历：<a href="https://vilot888.github.io/Resume20260907/">vilot888.github.io/Resume20260907</a></span>
      <span>源码：<a href="https://github.com/vilot888/resume-3d">github.com/vilot888/resume-3d</a></span>
    </div>
  </main>
</body>
</html>
